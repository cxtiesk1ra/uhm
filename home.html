<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Explorer Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>Space Explorer Portal</h1>
    <p>Enter your name to launch into learning</p>
  </div>

  <form id="loginForm">
    <label for="name">Astronaut Name</label>
    <input type="text" id="name" placeholder="Type your name..." required>
    <button type="submit">Start Mission</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
